name: IQ assessment

on:
  push:
    paths:
      - "iq-assessment/**"
      - ".github/workflows/iq-assessment.yml"
  pull_request:
    paths:
      - "iq-assessment/**"
      - ".github/workflows/iq-assessment.yml"

defaults:
  run:
    working-directory: iq-assessment

jobs:
  verify:
    name: Lint, types, item bank, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iq-assessment/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The frozen item bank must be exactly reproducible from the generators.
      - run: npm run bank:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end, accessibility and mobile tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iq-assessment/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: iq-assessment/test-results/
          retention-days: 7
