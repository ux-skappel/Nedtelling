name: Tester

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

      # Samme kommando som Vercel kjører. Da slår en ødelagt mal ut her, og
      # ikke først som en rød deploy.
      - name: Bygg nettstedet
        run: bash scripts/build_site.sh

      # De innsjekkede sidene i dashboard/ skal svare til dataene i data/.
      # Sprik betyr at noen har endret mal eller data uten å bygge på nytt.
      - name: Sjekk at dashboard/ er bygget på nytt
        run: |
          diff -q public/index.html dashboard/index.html
          diff -q public/simulering.html dashboard/simulering.html
