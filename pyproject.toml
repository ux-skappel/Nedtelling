[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplbot"
version = "0.1.0"
description = "Bot som analyserer og spiller Fantasy Premier League"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pulp>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
fplbot = "fplbot.cli:main"

[tool.setuptools.packages.find]
include = ["fplbot*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PIE", "ISC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
